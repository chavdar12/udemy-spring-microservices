spring:
  application:
    name: currency-exchange
  jpa:
    open-in-view: false
    defer-datasource-initialization: true
server:
  port: ${PORT:8000}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
resilience4j:
  retry:
    instances:
      sample-api:
        max-attempts: 3
        wait-duration: 500ms
  circuitbreaker:
    instances:
      sample-api:
        sliding-window-size: 10
        failure-rate-threshold: 50
  ratelimiter:
    instances:
      sample-api:
        limit-for-period: 2
        limit-refresh-period: 10s
        timeout-duration: 0s
